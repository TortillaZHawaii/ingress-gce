syntax = "proto3";

package experiments;

option go_package = "k8s.io/ingress-gce/pkg/experiments/grpc/pb";

service Experiments {
  rpc BoolFlagValueOrFailsafe (BoolFlagRequest) returns (BoolFlagResponse);
}

message BoolFlagRequest {
  string flag_name = 1;
  bool failsafe_value = 2;
}

message BoolFlagResponse {
  bool value = 1;
}
